name: Monthly Report

on:
    # runs 1st of every month at 06:00 UTC (~midnight MT)
    schedule:
      - cron: "0 6 1 * *"
    # allow manual run
    workflow_dispatch:
      inputs:
        test_mode:
          description: "Run without posting a PR (debug)"
          required: false
          default: "false"
        
permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r Scripts/requirements.txt

      - name: Validate export schema
        run: python Scripts/validate_export_schema.py

      - name: Compute year/month (UTC now)
        id: when
        run: |
          echo "YEAR=$(date -u +%Y)" >> $GITHUB_OUTPUT
          echo "MONTH=$(date -u +%m)" >> $GITHUB_OUTPUT

      - name: Generate monthly CSV
        run: |
          python Scripts/generate_montly_report.py \
            --year "${{ steps.when.outputs.YEAR }}" \
            --month "${{ steps.when.outputs.MONTH }}" \
            --seed 42
          ls -l Resources/Generated/

      - name: Lint generated CSV
        run: |
          f="Resources/Generated/monthly_${{ steps.when.outputs.YEAR }}_${{ steps.when.outputs.MONTH }}.csv"
          python Scripts/lint_trip_csv.py "$f"

      - name: Create PR with generated CSV
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: add monthly CSV for ${{ steps.when.outputs.YEAR }}-${{ steps.when.outputs.MONTH }}"
          title: "Monthly CSV: ${{ steps.when.outputs.YEAR }}-${{ steps.when.outputs.MONTH }}"
          body: |
            This PR adds the autogenerated monthly sample CSV.
            - Year: ${{ steps.when.outputs.YEAR }}
            - Month: ${{ steps.when.outputs.MONTH }}
          branch: bot/monthly-${{ steps.when.outputs.YEAR }}-${{ steps.when.outputs.MONTH }}
          signoff: false